server {
    listen 80;
    server_name api.typing-practice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.typing-practice.com;

    ssl_certificate /etc/letsencrypt/live/api.typing-practice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.typing-practice.com/privkey.pem;

    location / {
        # 파일 내용: set $app_upstream http://app-blue:8080; set $app_color blue;
        resolver 127.0.0.11 valid=5s;
        include /etc/nginx/runtime/app-upstream.conf;
        proxy_pass $app_upstream;
        add_header X-App-Color $app_color always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 7070 ssl;
    server_name api.typing-practice.com;

    ssl_certificate /etc/letsencrypt/live/api.typing-practice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.typing-practice.com/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}