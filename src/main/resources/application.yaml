spring:
  profiles:
    active: local
  application:
    name: typing-practice-be

  data:
    mongodb:
      # @CompoundIndex 선언을 앱 시작 시 생성 (Atlas 에는 동일 이름으로 이미 존재, 로컬/신규 환경 재현용)
      auto-index-creation: true

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


dotenv:
  path: .env.${spring.profiles.active}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

google:
  token-uri: https://oauth2.googleapis.com/token

quote:
  difficulty:
    cold-start-k: 20
    seed-weights: # 정적 seed 특성 가중치. 언어별 합 1.0 (기동 시 검증). 근거: Obsidian 적응형 서빙 개선/9. seed 가중치 적합성 분석
      korean:
        len: 0.35
        punc: 0.0
        space: 0.10
        digit: 0.20
        jamo: 0.0
        diphthong: 0.0
        shift-jamo: 0.35
      english:
        len: 0.20
        punc: 0.15
        space: 0.10
        digit: 0.15
        case-flip: 0.25
        word-len: 0.15
  similarity-threshold:
    korean: 0.5
    english: 0.5

adaptive-serving:
  beta: 43
  sigma-obs: 11
  perf-coefficient: 1.5
  sigma-process: 2
  surprise-threshold: 2
  default-mu: 50
  default-sigma: 20
