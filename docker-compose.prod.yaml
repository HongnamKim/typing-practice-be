x-app: &app
  # always 는 재부팅 때 멈춰 둔 색까지 되살려 배치가 두 번 돈다
  restart: unless-stopped
  pull_policy: never
  # Spring graceful shutdown 기본 30초보다 길게
  stop_grace_period: 35s
  depends_on:
    - redis
  env_file:
    - .env.prod
  environment:
    - SPRING_PROFILES_ACTIVE=prod
  volumes:
    - ./fallback:/data/fallback
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 120s

services:
  app-blue:
    <<: *app
    image: typing-practice-be:blue
    profiles:
      - blue

  app-green:
    <<: *app
    image: typing-practice-be:green
    profiles:
      - green

  redis:
    image: redis:8
    restart: always
    ports:
      - '6379:6379'

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: always
    ports:
      - '9121:9121'
    environment:
      - REDIS_ADDR=redis://redis:6379

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus-prod.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    restart: always
    volumes:
      - grafana-data:/var/lib/grafana

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '7070:7070'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./nginx/runtime:/etc/nginx/runtime:ro

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  grafana-data: